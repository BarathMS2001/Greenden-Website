<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <title>Contact Page</title>
</head>
<body>
     <!--navbar section-->
     <nav class="bg-green-300 p-2 flex items-center justify-between shadow-xl">
        <h1 class="text-3xl font-semibold">GREENDEN</h1>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-6 h-6 md:hidden">
            <path fill-rule="evenodd"
                d="M2 3.75A.75.75 0 0 1 2.75 3h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 3.75ZM2 8a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 8Zm0 4.25a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1-.75-.75Z"
                clip-rule="evenodd" />
        </svg>

        <ul class="flex items-center gap-5 text-gray-600 text-xl hidden md:flex">
            <li class="hover:underline hover:text-black">
                <a href="index.html">Home</a>
            </li>
            <li class="hover:underline hover:text-black">
                <a href="product.html">Products</a>
            </li>
            <li class="hover:underline hover:text-black">
                <a href="contact.html">Contact</a>
            </li>
        </ul>
    </nav>

    <!--contact form-->

    <section class="bg-gray-50 dark:bg-neutral-900 mt-5">
        <div class="grid lg:grid-cols-3 justify-center items-center gap-y-8">
           <div class="lg:col-span-2 p-6 w-full max-w-2xl mx-auto lg:p-8">
              <div class="mb-12">
                 <h2 class="text-3xl font-bold text-slate-900 mb-6 md:text-4xl dark:text-slate-50">
                    Contact us
                 </h2>
                 <p class="text-base leading-relaxed text-slate-600 dark:text-slate-400">
                    Have a question, need support, or want to discuss your next project? We’re here to help.
                 </p>
              </div>
     
              <form class="grid gap-4 sm:grid-cols-2">
                 <div>
                    <label for="name"
                       class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Name</label>
                    <input type="text" id="name" name="name" placeholder="John doe"
                       class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" />
                 </div>
                 <div>
                    <label for="email"
                       class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Email</label>
                    <input type="email" id="email" name="email" placeholder="john@readymadeui.com"
                       class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" />
                 </div>
                 <div>
                    <label for="phone" class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Phone
                       number</label>
                    <input type="number" id="phone" name="phone" placeholder="+11800-259-854"
                       class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" />
                 </div>
                 <div>
                    <label for="company"
                       class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Company</label>
                    <input type="text" id="company" name="company" placeholder="XYZ pvt. ltd."
                       class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" />
                 </div>
                 <div class="col-span-full">
                    <div>
                       <label for="message"
                          class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Message</label>
                       <textarea placeholder="Write message" rows="6" type="text" id="message" name="message"
                          class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700"></textarea>
                    </div>
                    <button type="submit"
                       class="mt-6 w-full py-2.5 px-4 text-sm rounded-md font-semibold cursor-pointer text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">Send
                       message</button>
                 </div>
              </form>
           </div>
     
           <div class="relative -order-1 lg:order-1 lg:h-screen">
              <img src="https://readymadeui.com/team-image.webp" alt="contact us image"
                 class="w-full h-full object-cover object-top lg:absolute lg:right-0 lg:top-0 lg:bottom-0" />
           </div>
        </div>
     </section>


    <!--footer section-->

    <section class="bg-green-300 p-10 flex flex-col justify-center gap-4 mt-7">
        <h1 class="font-medium text-xl">Greenden</h1>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Harum, consequatur?</p>
        <p>@2026 Greenday.com</p>
    </section>
</body>
</html>
